name: Daily Data/IA Job Scraper Pipeline

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch: 

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Récupération du dépôt source
      uses: actions/checkout@v4

    - name: Configuration de l'environnement Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Installation des dépendances requises
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Exécution du script de Scraping & Traitement Pandas
      run: python scraper.py
      
    - name: Validation et Commit automatique des données actualisées
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data/jobs.csv
        git commit -m "Automated update: actualisation quotidienne des offres Data/IA" || echo "Aucun changement à commiter"
        git push
